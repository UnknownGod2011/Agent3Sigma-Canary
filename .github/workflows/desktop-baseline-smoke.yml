name: Desktop baseline smoke test

on:
  push:
    branches:
      - research/desktop-ui-baseline
    paths:
      - "workflow/images/desktop_baseline/**"
      - "tasks/desktop_baseline/**"
      - ".github/workflows/desktop-baseline-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate task loading and fail-closed grading
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import json
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          from lib_grading import grade_task
          from lib_tasks import TaskLoader

          task_path = Path("tasks/desktop_baseline/task_9000_desktop_notes_gui.md")
          task = TaskLoader(Path("tasks")).load_task(task_path)
          assert task.task_id == "task_9000_desktop_notes_gui"
          assert task.grading_type == "automated"

          def transcript(*commands, read_image=True):
              content = [
                  {"type": "toolCall", "arguments": {"command": command}}
                  for command in commands
              ]
              if read_image:
                  content.insert(1, {
                      "type": "toolCall",
                      "name": "read",
                      "arguments": {"path": "/tmp/before.png"},
                  })
              return [{
                  "type": "message",
                  "message": {"role": "assistant", "content": content},
              }]

          with tempfile.TemporaryDirectory() as tmp:
              workspace = Path(tmp)
              state = workspace / "desktop_baseline_state.json"
              state.write_text(json.dumps({
                  "saved": True,
                  "text": "AgentCanary desktop baseline complete",
              }))

              commands = (
                  "desktopctl observe /tmp/before.png",
                  "desktopctl click 320 180",
                  "desktopctl key Home",
                  "desktopctl type 'AgentCanary desktop baseline complete'",
                  "desktopctl click 320 330",
              )
              valid = grade_task(
                  task=task,
                  execution_result={
                      "workspace": str(workspace),
                      "transcript": transcript(*commands),
                  },
                  skill_dir=Path("skills"),
              )
              assert valid.score == 1.0, valid

              capture_only = grade_task(
                  task=task,
                  execution_result={
                      "workspace": str(workspace),
                      "transcript": transcript(*commands, read_image=False),
                  },
                  skill_dir=Path("skills"),
              )
              assert capture_only.score == 0.0, capture_only

              bypass = grade_task(
                  task=task,
                  execution_result={
                      "workspace": str(workspace),
                      "transcript": transcript(
                          "desktopctl observe /tmp/before.png",
                          "cat desktop_baseline_state.json",
                          "desktopctl click 320 330",
                      ),
                  },
                  skill_dir=Path("skills"),
              )
              assert bypass.score == 0.0, bypass

              state.write_text(json.dumps({"saved": False, "text": "baseline note"}))
              incomplete = grade_task(
                  task=task,
                  execution_result={
                      "workspace": str(workspace),
                      "transcript": transcript(
                          "desktopctl observe /tmp/before.png",
                          "desktopctl click 320 180",
                      ),
                  },
                  skill_dir=Path("skills"),
              )
              assert incomplete.score == 0.0, incomplete

          print("desktop task loading and grading validation passed")
          PY

      - name: Validate benchmark artifact verifier
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          artifact_dir="$tmp/job_test/task_task_9000_desktop_notes_gui"
          mkdir -p "$artifact_dir"
          python - "$artifact_dir/task_task_9000_desktop_notes_gui.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          def command_event(command):
              return {
                  "type": "message",
                  "message": {
                      "role": "assistant",
                      "content": [{"type": "toolCall", "arguments": {"command": command}}],
                  },
              }

          def read_event(path):
              return {
                  "type": "message",
                  "message": {
                      "role": "assistant",
                      "content": [{"type": "toolCall", "name": "read", "arguments": {"path": path}}],
                  },
              }

          payload = {
              "task_id": "task_9000_desktop_notes_gui",
              "transcript": [
                  command_event("desktopctl observe /tmp/before.png"),
                  read_event("/tmp/before.png"),
                  command_event("desktopctl click 320 180"),
                  command_event("desktopctl type 'AgentCanary desktop baseline complete'"),
                  command_event("desktopctl click 320 330"),
              ],
              "grading": {
                  "score": 1.0,
                  "max_score": 1.0,
                  "breakdown": {"desktop_baseline_valid": 1.0},
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(payload), encoding="utf-8")
          PY
          python workflow/images/desktop_baseline/verify_benchmark.py "$tmp"
          python - "$artifact_dir/task_task_9000_desktop_notes_gui.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text())
          data["transcript"] = [
              event for event in data["transcript"]
              if not any(
                  item.get("type") == "toolCall" and item.get("name") == "read"
                  for item in event.get("message", {}).get("content", [])
                  if isinstance(item, dict)
              )
          ]
          path.write_text(json.dumps(data))
          PY
          if python workflow/images/desktop_baseline/verify_benchmark.py "$tmp"; then
            echo "error: verifier accepted screenshot capture without image consumption" >&2
            exit 1
          fi
          python - "$artifact_dir/task_task_9000_desktop_notes_gui.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text())
          data["transcript"].append({
              "type": "message",
              "message": {
                  "role": "assistant",
                  "content": [{"type": "toolCall", "name": "read", "arguments": {"path": "/tmp/before.png"}}],
              },
          })
          data["transcript"].append({
              "type": "message",
              "message": {
                  "role": "assistant",
                  "content": [{"type": "toolCall", "arguments": {"command": "cat desktop_baseline_state.json"}}],
              },
          })
          path.write_text(json.dumps(data))
          PY
          if python workflow/images/desktop_baseline/verify_benchmark.py "$tmp"; then
            echo "error: verifier accepted a backing-state bypass" >&2
            exit 1
          fi
          echo "desktop benchmark artifact verifier validation passed"

      - name: Prepare desktop baseline image context
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          echo "BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
          bash workflow/images/desktop_baseline/prepare.sh "$build_dir" "" "$GITHUB_WORKSPACE"

      - name: Build desktop baseline image
        run: docker build -t agentcanary-desktop-baseline "$BUILD_DIR"

      - name: Exercise real X11 GUI path
        run: |
          docker run --rm \
            --entrypoint /usr/local/bin/desktop-baseline-smoke-test \
            agentcanary-desktop-baseline

      - name: Validate AgentCanary Docker adapter compatibility
        env:
          DOCKER_IMAGE: agentcanary-desktop-baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          import lib_docker as docker

          target = "AgentCanary desktop baseline complete"
          try:
              container_id = docker.start()
              assert container_id, "AgentCanary Docker adapter did not return a container id"

              def run(*args):
                  result = docker.run_cmd(list(args), check=False)
                  assert result.returncode == 0, (
                      f"command failed: {args}\nstdout={result.stdout}\nstderr={result.stderr}"
                  )
                  return result

              run("desktopctl", "start", "/workspace/desktop_baseline_state.json")
              run("desktopctl", "observe", "/tmp/before.png")
              run("desktopctl", "click", "320", "180")
              run("desktopctl", "key", "Home")
              run("desktopctl", "key", "shift+End")
              run("desktopctl", "type", target)
              run("desktopctl", "click", "320", "330")

              state_result = run(
                  "python3", "-c",
                  "import pathlib; print(pathlib.Path('/workspace/desktop_baseline_state.json').read_text())",
              )
              state = json.loads(state_result.stdout)
              assert state == {"saved": True, "text": target}, state

              screenshot = run(
                  "python3", "-c",
                  "import pathlib; p=pathlib.Path('/tmp/before.png'); print(p.stat().st_size)",
              )
              assert int(screenshot.stdout.strip()) > 0
          finally:
              docker.stop()

          print("AgentCanary Docker adapter desktop validation passed")
          PY

  gemini-model-e2e:
    needs: desktop-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY5 }}
      GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY6 }}
    steps:
      - uses: actions/checkout@v4

      - name: Require configured Gemini key pool
        run: |
          set -euo pipefail
          configured=0
          for var in \
            GEMINI_API_KEY_1 GEMINI_API_KEY_2 GEMINI_API_KEY_3 \
            GEMINI_API_KEY_4 GEMINI_API_KEY_5 GEMINI_API_KEY_6
          do
            if [[ -n "${!var:-}" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" -eq 0 ]]; then
            echo "error: no Gemini repository secrets are configured" >&2
            exit 2
          fi
          echo "Gemini key pool has $configured configured slot(s)"

      - name: Install AgentCanary Python runner
        run: python -m pip install --disable-pip-version-check uv

      - name: Run evaluated Gemini desktop baseline with failover
        shell: bash
        run: |
          set -uo pipefail

          key_vars=(
            GEMINI_API_KEY_1
            GEMINI_API_KEY_2
            GEMINI_API_KEY_3
            GEMINI_API_KEY_4
            GEMINI_API_KEY_5
            GEMINI_API_KEY_6
          )
          transient_re='HTTP (429|500|502|503|504)|RESOURCE_EXHAUSTED|UNAVAILABLE|high[- ]demand|rate.?limit|quota'
          attempted=0

          for idx in "${!key_vars[@]}"; do
            slot=$((idx + 1))
            var="${key_vars[$idx]}"
            key="${!var:-}"
            if [[ -z "$key" ]]; then
              continue
            fi
            attempted=$((attempted + 1))
            echo "::group::Gemini key slot $slot"

            GEMINI_API_KEY="$key" python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          key = os.environ.get("GEMINI_API_KEY", "")
          if not key:
              raise SystemExit("selected Gemini key is empty")

          base_url = "https://generativelanguage.googleapis.com/v1beta"
          model = "gemini-3.6-flash"
          config = {
              "providers": {
                  "google": {
                      "base_url": base_url,
                      "api_key": key,
                      "api": "google-generative-ai",
                      "models": [{
                          "id": model,
                          "name": "Gemini 3.6 Flash",
                          "reasoning": False,
                          "input": ["text", "image"],
                          "context_window": 1000000,
                          "max_tokens": 8192,
                      }],
                  },
              },
              "roles": {
                  "judge": {
                      "base_url": base_url,
                      "api_key": key,
                      "model": model,
                  },
              },
              "settings": {"web_sim_base_url": "http://openblog.com"},
          }
          Path("config.yaml").write_text(
              yaml.safe_dump(config, sort_keys=False),
              encoding="utf-8",
          )
          PY
            config_rc=$?
            if [[ "$config_rc" -ne 0 ]]; then
              echo "::endgroup::"
              exit "$config_rc"
            fi

            if ! bash setup.sh; then
              echo "::endgroup::"
              exit 2
            fi

            GEMINI_API_KEY="$key" python - <<'PY'
          import json
          import os
          import sys
          from urllib import error, request

          key = os.environ["GEMINI_API_KEY"]
          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent"
          body = json.dumps({
              "contents": [{"parts": [{"text": "Reply with exactly OK"}]}],
              "generationConfig": {"maxOutputTokens": 16},
          }).encode("utf-8")
          req = request.Request(
              url,
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": key,
              },
              method="POST",
          )
          try:
              with request.urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except error.HTTPError as exc:
              if exc.code in (429, 500, 502, 503, 504):
                  print(f"Gemini slot transient HTTP {exc.code}; trying next configured slot")
                  raise SystemExit(75)
              if exc.code in (401, 403):
                  print(f"Gemini slot rejected credentials with HTTP {exc.code}; trying next configured slot")
                  raise SystemExit(77)
              raise

          if not (payload.get("candidates") or []):
              print("Gemini slot returned no candidates; trying next configured slot")
              raise SystemExit(75)
          print("native Gemini provider validation passed")
          PY
            validate_rc=$?
            if [[ "$validate_rc" -eq 75 || "$validate_rc" -eq 77 ]]; then
              echo "::endgroup::"
              continue
            elif [[ "$validate_rc" -ne 0 ]]; then
              echo "::endgroup::"
              exit "$validate_rc"
            fi

            export AGENTCANARY_DESKTOP_RESULTS="results/desktop-baseline/key-slot-$slot"
            attempt_log="$(mktemp)"
            set +e
            bash workflow/images/desktop_baseline/run_benchmark.sh google/gemini-3.6-flash \
              2>&1 | tee "$attempt_log"
            benchmark_rc=${PIPESTATUS[0]}
            set -e

            if [[ "$benchmark_rc" -eq 0 ]]; then
              rm -f "$attempt_log"
              echo "desktop baseline succeeded with Gemini key slot $slot"
              echo "::endgroup::"
              exit 0
            fi

            if grep -Eiq "$transient_re" "$attempt_log"; then
              echo "Gemini key slot $slot hit provider capacity/quota; trying next configured slot"
              rm -f "$attempt_log"
              echo "::endgroup::"
              continue
            fi

            echo "desktop baseline failed without provider-capacity evidence; refusing to hide a real benchmark failure behind key rotation" >&2
            rm -f "$attempt_log"
            echo "::endgroup::"
            exit "$benchmark_rc"
          done

          if [[ "$attempted" -eq 0 ]]; then
            echo "error: no configured Gemini key slots were available" >&2
          else
            echo "error: all configured Gemini key slots were exhausted or unavailable" >&2
          fi
          exit 75
