name: Desktop compatibility against upstream master

on:
  push:
    branches:
      - research/desktop-ui-baseline
    paths:
      - ".github/workflows/desktop-pr1-compatibility.yml"
      - "workflow/images/desktop_baseline/**"
      - "tasks/desktop_baseline/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  desktop-upstream-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fork branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record Docker client and server versions
        run: docker version

      - name: Stage the desktop fixture overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-overlay/workflow/images" "$RUNNER_TEMP/desktop-overlay/tasks"
          cp -a workflow/images/desktop_baseline "$RUNNER_TEMP/desktop-overlay/workflow/images/"
          cp -a tasks/desktop_baseline "$RUNNER_TEMP/desktop-overlay/tasks/"

      - name: Fetch current upstream master in an isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/upstream-master"
          git -C "$RUNNER_TEMP/upstream-master" remote add origin https://github.com/antgroup/Agent3Sigma-Canary.git
          git -C "$RUNNER_TEMP/upstream-master" fetch --depth=1 origin refs/heads/master
          git -C "$RUNNER_TEMP/upstream-master" checkout --detach FETCH_HEAD
          upstream_sha="$(git -C "$RUNNER_TEMP/upstream-master" rev-parse HEAD)"
          echo "UPSTREAM_MASTER_SHA=$upstream_sha" >> "$GITHUB_ENV"
          echo "Testing current upstream master: $upstream_sha"

      - name: Overlay the desktop task and helpers
        shell: bash
        working-directory: ${{ runner.temp }}/upstream-master
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/desktop-overlay/workflow/images/desktop_baseline" workflow/images/
          cp -a "$RUNNER_TEMP/desktop-overlay/tasks/desktop_baseline" tasks/
          # The image builder needs generated config, but this test must not need secrets.
          printf '{"models":{"mode":"merge","providers":{}},"tools":{"profile":"full"}}\n' > workflow/openclaw.json

      - name: Install uv for the upstream runner
        run: python -m pip install --disable-pip-version-check uv

      - name: Run desktop adapter regression tests against the upstream runner
        shell: bash
        working-directory: ${{ runner.temp }}/upstream-master
        run: |
          set -euo pipefail
          uv run python workflow/images/desktop_baseline/test_evidence_parser.py
          python workflow/images/desktop_baseline/test_model_attempt_classifier.py
          uv run python workflow/images/desktop_baseline/test_desktop_model_stub.py
          python workflow/images/desktop_baseline/test_desktop_ocr.py
          uv run python workflow/images/desktop_baseline/test_desktop_runtime_preflight.py
          uv run python workflow/images/desktop_baseline/test_run_benchmark_preflight.py
          uv run python workflow/images/desktop_baseline/test_results_dir_isolation.py
          uv run python workflow/images/desktop_baseline/test_safe_container_export.py
          uv run python workflow/images/desktop_baseline/test_workspace_copyback_cleanup.py
          uv run python workflow/images/desktop_baseline/test_bind_mount_handoff.py
          uv run python workflow/images/desktop_baseline/test_bind_mount_runner.py
          uv run python workflow/images/desktop_baseline/test_compare_repeated_runs.py
          uv run python workflow/images/desktop_baseline/test_upstream_runner_compatibility.py

      - name: Prepare the upstream builder context and build a desktop-compatible image
        shell: bash
        working-directory: ${{ runner.temp }}/upstream-master
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/agentcanary-upstream-builder"
          rm -rf "$workspace"
          python workflow/build_images.py \
            --images official \
            --prepare-only \
            --non-interactive \
            --workspace "$workspace"
          context="$workspace/build_official"
          mkdir -p "$context/desktop"
          cp workflow/images/desktop_baseline/desktop/notes_ui.py "$context/desktop/"
          cp workflow/images/desktop_baseline/desktop/desktop_ocr.py "$context/desktop/"
          cp workflow/images/desktop_baseline/desktop/desktopctl "$context/desktop/"
          cp workflow/images/desktop_baseline/desktop_model_stub.py "$context/desktop/"
          cp workflow/images/desktop_baseline/desktop_baseline_entrypoint.sh "$context/desktop/"
          cp workflow/images/desktop_baseline/smoke_test.sh "$context/desktop/"
          cat >> "$context/Dockerfile" <<'DOCKER'

          # Desktop/UI feasibility overlay: retain the upstream builder's OpenClaw version,
          # mock API, configuration, and image labels; add only the real GUI surface.
          USER root
          RUN apt-get update && apt-get install -y \
              python3-tk \
              xvfb \
              xdotool \
              x11-utils \
              scrot \
              tesseract-ocr \
              && rm -rf /var/lib/apt/lists/*
          RUN mkdir -p /opt/agentcanary-desktop /tmp/agentcanary-desktop
          COPY desktop/notes_ui.py /opt/agentcanary-desktop/notes_ui.py
          COPY desktop/desktop_ocr.py /opt/agentcanary-desktop/desktop_ocr.py
          COPY desktop/desktop_model_stub.py /opt/agentcanary-desktop/desktop_model_stub.py
          COPY desktop/desktopctl /usr/local/bin/desktopctl
          COPY desktop/desktop_baseline_entrypoint.sh /usr/local/bin/desktop-baseline-entrypoint.sh
          COPY desktop/smoke_test.sh /usr/local/bin/desktop-baseline-smoke-test
          RUN chmod +x /opt/agentcanary-desktop/desktop_ocr.py /usr/local/bin/desktopctl /usr/local/bin/desktop-baseline-entrypoint.sh /usr/local/bin/desktop-baseline-smoke-test
          ENV DISPLAY=:99
          ENV DESKTOP_BASELINE_STATE=/tmp/agentcanary-desktop/desktop_baseline_state.json
          ENTRYPOINT ["/usr/local/bin/desktop-baseline-entrypoint.sh"]
          DOCKER
          echo "Builder OpenClaw pin: $(grep -E 'LABEL ai.agentcanary.openclaw_version=' "$context/Dockerfile" | tail -n 1)"
          docker build -t agentcanary-desktop-upstream-base "$context"

      - name: Create the reference-controller image
        shell: bash
        working-directory: ${{ runner.temp }}/upstream-master
        run: |
          set -euo pipefail
          container="agentcanary-desktop-upstream-reference-build"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker create --name "$container" agentcanary-desktop-upstream-base >/dev/null
          docker cp workflow/images/desktop_baseline/reference_openclaw.py "$container:/usr/local/bin/agentcanary-reference-openclaw"
          docker start "$container" >/dev/null
          docker exec "$container" chmod 0755 /usr/local/bin/agentcanary-reference-openclaw
          docker exec "$container" ln -sf /usr/local/bin/agentcanary-reference-openclaw /usr/local/bin/openclaw
          docker stop "$container" >/dev/null
          docker commit "$container" agentcanary-desktop-upstream-reference >/dev/null

      - name: Run the deterministic reference lifecycle twice on the upstream runner
        shell: bash
        working-directory: ${{ runner.temp }}/upstream-master
        run: |
          set -euo pipefail
          for attempt in first repeat; do
            results_dir="$RUNNER_TEMP/upstream-reference-$attempt"
            rm -rf "$results_dir"
            DOCKER_IMAGE=agentcanary-desktop-upstream-reference uv run python \
              workflow/images/desktop_baseline/run_reference_benchmark.py \
              --model reference/desktop \
              --suite task_9000_desktop_notes_gui \
              --docker \
              --timeout-multiplier 1.0 \
              --output-dir "$results_dir" \
              --verbose
            uv run python workflow/images/desktop_baseline/verify_benchmark.py "$results_dir"
          done
          echo "Reference lifecycle repeated on upstream master $UPSTREAM_MASTER_SHA"

      - name: Confirm host grading depends on artifact copyback
        shell: bash
        working-directory: ${{ runner.temp }}/upstream-master
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/upstream-negative-control"
          rm -rf "$results_dir"
          DOCKER_IMAGE=agentcanary-desktop-upstream-reference uv run python \
            workflow/images/desktop_baseline/run_reference_benchmark.py \
            --no-artifact-copyback \
            --assert-container-state-before-stop \
            --model reference/desktop \
            --suite task_9000_desktop_notes_gui \
            --docker \
            --timeout-multiplier 1.0 \
            --output-dir "$results_dir" \
            --verbose
          python - "$results_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          task_id = "task_9000_desktop_notes_gui"
          artifacts = list(root.glob(f"job_*/task_{task_id}/task_{task_id}.json"))
          assert artifacts, f"no negative-control artifact found under {root}"
          data = json.loads(max(artifacts, key=lambda p: p.stat().st_mtime_ns).read_text(encoding="utf-8"))
          grading = data.get("grading", {})
          assert data.get("task_id") == task_id, data.get("task_id")
          assert grading.get("max_score") == 1.0 and grading.get("score") == 0.0, grading
          assert grading.get("breakdown", {}).get("desktop_baseline_valid") == 0.0, grading
          print("negative control confirmed: GUI state exists in-container, but host grading fails without copyback")
          PY

      - name: Build the credential-free local OpenClaw provider image
        shell: bash
        working-directory: ${{ runner.temp }}/upstream-master
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/desktop-openclaw-stub.json"
          cat > "$config" <<'JSON'
          {
            "models": {
              "mode": "merge",
              "providers": {
                "desktop-stub": {
                  "baseUrl": "http://127.0.0.1:8765/v1",
                  "apiKey": "agentcanary-local-stub-key",
                  "api": "openai-completions",
                  "models": [{
                    "id": "desktop-fixture",
                    "name": "AgentCanary desktop integration fixture",
                    "reasoning": false,
                    "input": ["text", "image"],
                    "cost": {"input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0},
                    "contextWindow": 32768,
                    "maxTokens": 2048
                  }]
                }
              }
            },
            "agents": {
              "defaults": {
                "model": {"primary": "desktop-stub/desktop-fixture"},
                "models": {"desktop-stub/desktop-fixture": {"alias": "desktop.stub.desktop.fixture"}}
              }
            },
            "tools": {"profile": "full"}
          }
          JSON
          marker="$RUNNER_TEMP/enable-model-stub"
          : > "$marker"
          container="agentcanary-desktop-upstream-stub-build"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker create --name "$container" agentcanary-desktop-upstream-base >/dev/null
          docker cp "$config" "$container:/root/.openclaw/openclaw.json"
          docker cp "$marker" "$container:/opt/agentcanary-desktop/enable-model-stub"
          docker start "$container" >/dev/null
          ready=false
          for _ in $(seq 1 40); do
            if docker exec "$container" curl -fsS http://127.0.0.1:8765/health >/dev/null; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" != true ]]; then
            docker logs "$container" || true
            docker exec "$container" cat /tmp/agentcanary-desktop-model-stub.log || true
            exit 1
          fi
          docker stop "$container" >/dev/null
          docker commit "$container" agentcanary-desktop-upstream-openclaw-stub >/dev/null

      - name: Run the real OpenClaw tool loop against the local provider twice
        shell: bash
        working-directory: ${{ runner.temp }}/upstream-master
        run: |
          set -euo pipefail
          for attempt in first repeat; do
            results_dir="$RUNNER_TEMP/upstream-openclaw-stub-$attempt"
            rm -rf "$results_dir"
            DOCKER_IMAGE=agentcanary-desktop-upstream-openclaw-stub uv run python \
              workflow/images/desktop_baseline/run_reference_benchmark.py \
              --model desktop-stub/desktop-fixture \
              --suite task_9000_desktop_notes_gui \
              --docker \
              --timeout-multiplier 1.0 \
              --output-dir "$results_dir" \
              --verbose
            uv run python workflow/images/desktop_baseline/verify_benchmark.py "$results_dir"
            python - "$results_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          task_id = "task_9000_desktop_notes_gui"
          artifacts = list(root.glob(f"job_*/task_{task_id}/task_{task_id}.json"))
          assert artifacts, f"no local-provider artifact found under {root}"
          data = json.loads(max(artifacts, key=lambda p: p.stat().st_mtime_ns).read_text(encoding="utf-8"))
          assert data.get("task_id") == task_id, data.get("task_id")
          assert data.get("grading", {}).get("score") == 1.0, data.get("grading")
          calls, call_ids, image_reads = [], [], []
          for event in data.get("transcript", []):
              if not isinstance(event, dict) or event.get("type") != "message":
                  continue
              message = event.get("message", {})
              if not isinstance(message, dict) or message.get("role") != "assistant":
                  continue
              for item in message.get("content", []):
                  if not isinstance(item, dict) or item.get("type") != "toolCall":
                      continue
                  call_ids.append(str(item.get("id", "")))
                  calls.append(item.get("name"))
                  args = item.get("arguments", {})
                  if isinstance(args, dict) and item.get("name") == "read":
                      path = args.get("path")
                      if isinstance(path, str) and path.endswith(".png"):
                          image_reads.append(path)
          assert calls.count("exec") >= 5, calls
          assert "read" in calls and image_reads, (calls, image_reads)
          assert call_ids and not any(value.startswith("desktop-reference-") for value in call_ids), call_ids
          print("local-provider trajectory verified: screenshot read, GUI tool calls, and independent 1.0 score")
          PY
          done
          echo "Local-provider tool loop repeated on upstream master $UPSTREAM_MASTER_SHA; no external model provider was called."

      - name: Run task-scoped bind-mount reference lifecycle twice on upstream runner
        shell: bash
        working-directory: ${{ runner.temp }}/upstream-master
        run: |
          set -euo pipefail
          for attempt in first repeat; do
            results_dir="$RUNNER_TEMP/upstream-bind-mount-reference-$attempt"
            rm -rf "$results_dir"
            DOCKER_IMAGE=agentcanary-desktop-upstream-reference uv run python \
              workflow/images/desktop_baseline/run_bind_mount_benchmark.py \
              --model reference/desktop \
              --suite task_9000_desktop_notes_gui \
              --docker \
              --timeout-multiplier 1.0 \
              --output-dir "$results_dir" \
              --verbose
            uv run python workflow/images/desktop_baseline/verify_benchmark.py "$results_dir"
          done
          python workflow/images/desktop_baseline/compare_repeated_runs.py \
            --first "$RUNNER_TEMP/upstream-bind-mount-reference-first" \
            --repeat "$RUNNER_TEMP/upstream-bind-mount-reference-repeat" \
            --mode reference \
            --upstream-sha "$UPSTREAM_MASTER_SHA" \
            --output "$RUNNER_TEMP/upstream-bind-mount-reference-first/desktop_reproducibility_manifest.json"

      - name: Run task-scoped bind-mount OpenClaw tool loop twice on upstream runner
        shell: bash
        working-directory: ${{ runner.temp }}/upstream-master
        run: |
          set -euo pipefail
          for attempt in first repeat; do
            results_dir="$RUNNER_TEMP/upstream-bind-mount-openclaw-stub-$attempt"
            rm -rf "$results_dir"
            DOCKER_IMAGE=agentcanary-desktop-upstream-openclaw-stub uv run python \
              workflow/images/desktop_baseline/run_bind_mount_benchmark.py \
              --model desktop-stub/desktop-fixture \
              --suite task_9000_desktop_notes_gui \
              --docker \
              --timeout-multiplier 1.0 \
              --output-dir "$results_dir" \
              --verbose
            uv run python workflow/images/desktop_baseline/verify_benchmark.py "$results_dir"
            python - "$results_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          task_id = "task_9000_desktop_notes_gui"
          artifacts = list(root.glob(f"job_*/task_{task_id}/task_{task_id}.json"))
          assert len(artifacts) == 1, artifacts
          data = json.loads(artifacts[0].read_text(encoding="utf-8"))
          assert data.get("grading", {}).get("score") == 1.0, data.get("grading")
          calls, call_ids, image_reads = [], [], []
          for event in data.get("transcript", []):
              if not isinstance(event, dict) or event.get("type") != "message":
                  continue
              message = event.get("message", {})
              if not isinstance(message, dict) or message.get("role") != "assistant":
                  continue
              for item in message.get("content", []):
                  if not isinstance(item, dict) or item.get("type") != "toolCall":
                      continue
                  call_ids.append(str(item.get("id", "")))
                  calls.append((item.get("name"), item.get("arguments", {})))
                  args = item.get("arguments", {})
                  if isinstance(args, dict) and item.get("name") == "read":
                      path = args.get("path")
                      if isinstance(path, str) and path.endswith(".png"):
                          image_reads.append(path)
          assert sum(name == "exec" for name, _ in calls) >= 5, calls
          assert any(name == "read" for name, _ in calls) and image_reads, (calls, image_reads)
          assert call_ids and not any(value.startswith("desktop-reference-") for value in call_ids), call_ids
          print("upstream bind-mount OpenClaw run verified: screenshot read, GUI tool calls, and 1.0 grade")
          PY
          done
          python workflow/images/desktop_baseline/compare_repeated_runs.py \
            --first "$RUNNER_TEMP/upstream-bind-mount-openclaw-stub-first" \
            --repeat "$RUNNER_TEMP/upstream-bind-mount-openclaw-stub-repeat" \
            --mode openclaw-local-stub \
            --upstream-sha "$UPSTREAM_MASTER_SHA" \
            --output "$RUNNER_TEMP/upstream-bind-mount-openclaw-stub-first/desktop_reproducibility_manifest.json"

      - name: Confirm the no-mount negative control on upstream runner
        shell: bash
        working-directory: ${{ runner.temp }}/upstream-master
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/upstream-no-bind-mount-negative-control"
          rm -rf "$results_dir"
          DOCKER_IMAGE=agentcanary-desktop-upstream-reference uv run python \
            workflow/images/desktop_baseline/run_bind_mount_benchmark.py \
            --no-artifact-mount \
            --no-artifact-copyback \
            --assert-container-state-before-stop \
            --model reference/desktop \
            --suite task_9000_desktop_notes_gui \
            --docker \
            --timeout-multiplier 1.0 \
            --output-dir "$results_dir" \
            --verbose
          python - "$results_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          task_id = "task_9000_desktop_notes_gui"
          artifacts = list(root.glob(f"job_*/task_{task_id}/task_{task_id}.json"))
          assert len(artifacts) == 1, artifacts
          data = json.loads(artifacts[0].read_text(encoding="utf-8"))
          grading = data.get("grading", {})
          assert data.get("task_id") == task_id, data.get("task_id")
          assert grading.get("max_score") == 1.0 and grading.get("score") == 0.0, grading
          assert grading.get("breakdown", {}).get("desktop_baseline_valid") == 0.0, grading
          calls = []
          for event in data.get("transcript", []):
              if not isinstance(event, dict) or event.get("type") != "message":
                  continue
              message = event.get("message", {})
              if not isinstance(message, dict) or message.get("role") != "assistant":
                  continue
              for item in message.get("content", []):
                  if isinstance(item, dict) and item.get("type") == "toolCall":
                      calls.append((item.get("name"), item.get("arguments", {})))
          assert any(name == "read" for name, _ in calls), calls
          assert any(
              name == "exec" and isinstance(args, dict)
              and str(args.get("command", "")).startswith("desktopctl click ")
              for name, args in calls
          ), calls
          print("upstream no-mount control confirmed: GUI trajectory completed in Docker, host grading scored 0.0")
          PY

      - name: Preserve compatibility run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-upstream-compatibility-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/upstream-reference-first/**
            ${{ runner.temp }}/upstream-reference-repeat/**
            ${{ runner.temp }}/upstream-negative-control/**
            ${{ runner.temp }}/upstream-openclaw-stub-first/**
            ${{ runner.temp }}/upstream-openclaw-stub-repeat/**
            ${{ runner.temp }}/upstream-bind-mount-reference-first/**
            ${{ runner.temp }}/upstream-bind-mount-reference-repeat/**
            ${{ runner.temp }}/upstream-bind-mount-openclaw-stub-first/**
            ${{ runner.temp }}/upstream-bind-mount-openclaw-stub-repeat/**
            ${{ runner.temp }}/upstream-no-bind-mount-negative-control/**
          if-no-files-found: warn
          retention-days: 7
