name: Desktop reference lifecycle

on:
  push:
    branches:
      - research/desktop-ui-baseline
    paths:
      - "workflow/images/desktop_baseline/**"
      - "tasks/desktop_baseline/**"
      - "benchmark.py"
      - "scripts/**"
      - "workflow/images/official/**"
      - "assets/mock_api/**"
      - "pyproject.toml"
      - "uv.lock"
      - "setup.sh"
      - ".github/workflows/desktop-reference-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-reference-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify desktop CI watches image source dependencies
        run: python workflow/images/desktop_baseline/test_workflow_trigger_paths.py

      - name: Install AgentCanary Python runner
        run: python -m pip install --disable-pip-version-check uv

      - name: Run desktop evidence regression tests
        run: uv run python workflow/images/desktop_baseline/test_evidence_parser.py

      - name: Run model-attempt classification regression tests
        run: python workflow/images/desktop_baseline/test_model_attempt_classifier.py

      - name: Run deterministic OpenClaw model-stub regression tests
        run: python workflow/images/desktop_baseline/test_desktop_model_stub.py

      - name: Verify live-model job requires explicit opt-in
        run: python workflow/images/desktop_baseline/test_live_model_opt_in.py

      - name: Run desktop runner placeholder preflight regression tests
        run: python workflow/images/desktop_baseline/test_run_benchmark_preflight.py

      - name: Verify each desktop run gets an isolated result directory
        run: python workflow/images/desktop_baseline/test_results_dir_isolation.py

      - name: Verify container teardown if workspace copyback fails
        run: uv run python workflow/images/desktop_baseline/test_workspace_copyback_cleanup.py

      - name: Prepare desktop baseline image context
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          echo "BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
          bash workflow/images/desktop_baseline/prepare.sh "$build_dir" "" "$GITHUB_WORKSPACE"

      - name: Build desktop baseline image
        run: docker build -t agentcanary-desktop-baseline "$BUILD_DIR"


      - name: Build credential-free OpenClaw local-model integration image
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/desktop-openclaw-stub.json"
          cat > "$config" <<'JSON'
          {
            "models": {
              "mode": "merge",
              "providers": {
                "desktop-stub": {
                  "baseUrl": "http://127.0.0.1:8765/v1",
                  "apiKey": "agentcanary-local-stub-key",
                  "api": "openai-completions",
                  "models": [
                    {
                      "id": "desktop-fixture",
                      "name": "AgentCanary desktop integration fixture",
                      "reasoning": false,
                      "input": ["text", "image"],
                      "cost": {"input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0},
                      "contextWindow": 32768,
                      "maxTokens": 2048
                    }
                  ]
                }
              }
            },
            "agents": {
              "defaults": {
                "model": {"primary": "desktop-stub/desktop-fixture"},
                "models": {
                  "desktop-stub/desktop-fixture": {"alias": "desktop.stub.desktop.fixture"}
                }
              }
            },
            "tools": {"profile": "full"}
          }
          JSON

          marker="$RUNNER_TEMP/enable-model-stub"
          : > "$marker"
          container="agentcanary-desktop-openclaw-stub-build"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker create --name "$container" agentcanary-desktop-baseline >/dev/null
          docker cp "$config" "$container:/root/.openclaw/openclaw.json"
          docker cp "$marker" "$container:/opt/agentcanary-desktop/enable-model-stub"
          docker start "$container" >/dev/null

          ready=false
          for _ in $(seq 1 40); do
            if docker exec "$container" curl -fsS http://127.0.0.1:8765/health >/dev/null; then
              ready=true
              break
            fi
            sleep 0.25
          done
          [[ "$ready" == true ]] || {
            docker logs "$container" || true
            docker exec "$container" cat /tmp/agentcanary-desktop-model-stub.log || true
            exit 1
          }

          docker stop "$container" >/dev/null
          docker commit "$container" agentcanary-desktop-openclaw-stub >/dev/null

      - name: Build credential-free reference-agent image
        run: |
          set -euo pipefail
          container="agentcanary-desktop-reference-build"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker create --name "$container" agentcanary-desktop-baseline >/dev/null
          docker cp \
            workflow/images/desktop_baseline/reference_openclaw.py \
            "$container:/usr/local/bin/agentcanary-reference-openclaw"
          docker start "$container" >/dev/null
          docker exec "$container" chmod 0755 /usr/local/bin/agentcanary-reference-openclaw
          docker exec "$container" \
            ln -sf /usr/local/bin/agentcanary-reference-openclaw /usr/local/bin/openclaw
          docker stop "$container" >/dev/null
          docker commit "$container" agentcanary-desktop-reference >/dev/null

      - name: Run full AgentCanary desktop lifecycle
        env:
          DOCKER_IMAGE: agentcanary-desktop-reference
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/desktop-reference-results"
          rm -rf "$results_dir"

          uv run python workflow/images/desktop_baseline/run_reference_benchmark.py \
            --model reference/desktop \
            --suite task_9000_desktop_notes_gui \
            --docker \
            --timeout-multiplier 1.0 \
            --output-dir "$results_dir" \
            --verbose

          uv run python \
            workflow/images/desktop_baseline/verify_benchmark.py \
            "$results_dir"

      - name: Repeat reference lifecycle to check reproducibility
        env:
          DOCKER_IMAGE: agentcanary-desktop-reference
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/desktop-reference-results-repeat"
          rm -rf "$results_dir"

          uv run python workflow/images/desktop_baseline/run_reference_benchmark.py \
            --model reference/desktop \
            --suite task_9000_desktop_notes_gui \
            --docker \
            --timeout-multiplier 1.0 \
            --output-dir "$results_dir" \
            --verbose

          uv run python workflow/images/desktop_baseline/verify_benchmark.py "$results_dir"
          echo "independent reference lifecycle run reproduced the expected GUI state and grade"


      - name: Run real OpenClaw tool loop against deterministic local provider
        env:
          DOCKER_IMAGE: agentcanary-desktop-openclaw-stub
        run: |
          set -euo pipefail
          for attempt in first repeat; do
            results_dir="$RUNNER_TEMP/desktop-openclaw-stub-$attempt"
            rm -rf "$results_dir"

            uv run python workflow/images/desktop_baseline/run_reference_benchmark.py \
              --model desktop-stub/desktop-fixture \
              --suite task_9000_desktop_notes_gui \
              --docker \
              --timeout-multiplier 1.0 \
              --output-dir "$results_dir" \
              --verbose

            uv run python workflow/images/desktop_baseline/verify_benchmark.py "$results_dir"

            python - "$results_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          task_id = "task_9000_desktop_notes_gui"
          artifacts = list(root.glob(f"job_*/task_{task_id}/task_{task_id}.json"))
          assert artifacts, f"no OpenClaw stub-run artifact found under {root}"
          artifact = max(artifacts, key=lambda path: path.stat().st_mtime_ns)
          data = json.loads(artifact.read_text(encoding="utf-8"))
          assert data.get("task_id") == task_id, data.get("task_id")
          grading = data.get("grading", {})
          assert grading.get("score") == 1.0, grading

          calls = []
          call_ids = []
          image_reads = []
          for event in data.get("transcript", []):
              if not isinstance(event, dict) or event.get("type") != "message":
                  continue
              message = event.get("message", {})
              if not isinstance(message, dict) or message.get("role") != "assistant":
                  continue
              for item in message.get("content", []):
                  if not isinstance(item, dict) or item.get("type") != "toolCall":
                      continue
                  call_ids.append(str(item.get("id", "")))
                  calls.append(item.get("name"))
                  arguments = item.get("arguments", {})
                  if isinstance(arguments, dict) and item.get("name") == "read":
                      path = arguments.get("path")
                      if isinstance(path, str) and path.endswith(".png"):
                          image_reads.append(path)

          assert calls.count("exec") >= 5, calls
          assert "read" in calls and image_reads, (calls, image_reads)
          assert call_ids and not any(call_id.startswith("desktop-reference-") for call_id in call_ids), (
              "the integration run appears to have used the reference shim rather than the installed OpenClaw CLI",
              call_ids,
          )
          print(f"real OpenClaw tool-loop artifact verified: {artifact}")
          PY
          done
          echo "two real OpenClaw tool-loop runs reproduced the expected independently graded GUI task"

      - name: Prove host grading requires Docker workspace copyback
        env:
          DOCKER_IMAGE: agentcanary-desktop-reference
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/desktop-no-copyback-results"
          rm -rf "$results_dir"

          uv run python workflow/images/desktop_baseline/run_reference_benchmark.py \
            --no-workspace-copyback \
            --assert-container-state-before-stop \
            --model reference/desktop \
            --suite task_9000_desktop_notes_gui \
            --docker \
            --timeout-multiplier 1.0 \
            --output-dir "$results_dir" \
            --verbose

          python - "$results_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          task_id = "task_9000_desktop_notes_gui"
          root = Path(sys.argv[1])
          candidates = list(root.glob(f"job_*/task_{task_id}/task_{task_id}.json"))
          assert candidates, f"no negative-control artifact found under {root}"
          artifact = max(candidates, key=lambda path: path.stat().st_mtime_ns)
          data = json.loads(artifact.read_text(encoding="utf-8"))
          grading = data.get("grading", {})
          assert data.get("task_id") == task_id, data.get("task_id")
          assert grading.get("max_score") == 1.0, grading
          assert grading.get("score") == 0.0, (
              "no-copyback control unexpectedly passed host-side grading",
              grading,
          )
          breakdown = grading.get("breakdown", {})
          assert breakdown.get("desktop_baseline_valid") == 0.0, breakdown

          commands = []
          image_reads = []
          for event in data.get("transcript", []):
              if not isinstance(event, dict) or event.get("type") != "message":
                  continue
              message = event.get("message", {})
              if not isinstance(message, dict) or message.get("role") != "assistant":
                  continue
              for item in message.get("content", []):
                  if not isinstance(item, dict) or item.get("type") != "toolCall":
                      continue
                  args = item.get("arguments", {})
                  if isinstance(args, dict):
                      command = args.get("command")
                      if isinstance(command, str):
                          commands.append(command.lower())
                      path = args.get("path")
                      if item.get("name") == "read" and isinstance(path, str):
                          image_reads.append(path.lower())
                  elif isinstance(args, str):
                      commands.append(args.lower())

          assert any("desktopctl observe" in command for command in commands), commands
          assert any(path.endswith(".png") for path in image_reads), image_reads
          assert any("desktopctl click" in command for command in commands), commands
          assert any("desktopctl type" in command for command in commands), commands
          assert any("desktopctl key" in command for command in commands), commands
          forbidden = ("desktop_baseline_state.json", "notes_app.py", "/opt/agentcanary-desktop")
          assert not any(marker in command for command in commands for marker in forbidden), commands

          print(
              "negative control confirmed: the reference trajectory contains screenshot "
              "inspection and GUI actions, but host-side grading scores 0.0 without workspace copyback"
          )
          print(f"artifact: {artifact}")
          PY

      - name: Assert reference trajectory stays inside GUI boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "workflow/images/desktop_baseline/reference_openclaw.py"
          ).read_text(encoding="utf-8")
          forbidden_runtime_reads = (
              "read_text(encoding=\"utf-8\")  # desktop_baseline_state",
              "notes_app.py",
              "/opt/agentcanary-desktop",
          )
          for marker in forbidden_runtime_reads:
              assert marker not in source, marker

          wrapper = Path(
              "workflow/images/desktop_baseline/run_reference_benchmark.py"
          ).read_text(encoding="utf-8")
          task = Path(
              "tasks/desktop_baseline/task_9000_desktop_notes_gui.md"
          ).read_text(encoding="utf-8")
          # The task frontmatter is YAML embedded in Markdown, so quotes in its
          # command scalar are escaped in the source file. Normalize only that
          # frontmatter before asserting the pre_setup contract.
          task_frontmatter = task.split("---", 2)[1].replace('\\\"', '"')
          assert "_copy_task_workspaces_to_host" in wrapper
          assert "_copy_grader_state_artifact_to_host" in wrapper
          assert 'STATE_ARTIFACT_IN_CONTAINER = "/tmp/agentcanary-desktop/desktop_baseline_state.json"' in wrapper
          assert "state artifact leaked into agent workspace" in wrapper
          assert 'desktopctl start "$AGENTCANARY_TASK_WORKSPACE/desktop_baseline_state.json"' not in task_frontmatter
          assert 'rm -f "$AGENTCANARY_TASK_WORKSPACE/desktop_baseline_state.json"' in task_frontmatter
          assert "/tmp/agentcanary-desktop/desktop_baseline_state.json" in task_frontmatter
          assert '"docker",' in wrapper
          assert '"cp",' in wrapper
          assert "benchmark.main()" in wrapper
          assert "grade_task" not in wrapper

          assert "_inspect_png(SCREENSHOT_PATH)" in source
          assert '"desktopctl", "observe"' in source
          assert '"desktopctl", "click"' in source
          assert '"desktopctl", "type"' in source
          print("reference controller GUI-boundary assertions passed")
          PY

      - name: Verify and package grader-only desktop state evidence
        if: success()
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          workspace_root = Path("/tmp/scry")
          task_id = "task_9000_desktop_notes_gui"
          target = "AgentCanary desktop baseline complete"
          positive_runs = {
              "reference-first": "desktop-reference-results",
              "reference-repeat": "desktop-reference-results-repeat",
              "openclaw-stub-first": "desktop-openclaw-stub-first",
              "openclaw-stub-repeat": "desktop-openclaw-stub-repeat",
          }
          evidence_dir = runner_temp / "desktop-state-evidence"
          shutil.rmtree(evidence_dir, ignore_errors=True)
          provenance = {
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "event_name": os.environ.get("GITHUB_EVENT_NAME", ""),
          }
          assert re.fullmatch(r"[0-9a-f]{40}", provenance["commit_sha"]), provenance
          assert provenance["run_id"].isdigit(), provenance
          assert provenance["run_attempt"].isdigit(), provenance
          assert all(provenance[key] for key in ("repository", "ref", "workflow", "event_name")), provenance

          task_definition = Path("tasks/desktop_baseline/task_9000_desktop_notes_gui.md")
          manifest = {
              "schema_version": 1,
              "provenance": provenance,
              "task_id": task_id,
              "task_definition_sha256": hashlib.sha256(task_definition.read_bytes()).hexdigest(),
              "target_text": target,
              "positive_runs": [],
          }
          expected_state_paths = set()
          validated_states = []

          def checked_workspace(raw_path, label):
              assert isinstance(raw_path, str), (label, raw_path)
              workspace = Path(raw_path)
              assert workspace.is_absolute() and workspace == workspace.resolve(strict=False), (label, workspace)
              try:
                  relative = workspace.relative_to(workspace_root)
              except ValueError as exc:
                  raise AssertionError(f"{label}: workspace escaped {workspace_root}: {workspace}") from exc
              assert len(relative.parts) == 2 and relative.parts[-1] == "agent_workspace", (label, relative)
              assert not workspace_root.is_symlink() and not workspace.parent.is_symlink() and not workspace.is_symlink(), (label, workspace)
              return workspace

          for label, directory in positive_runs.items():
              candidates = list((runner_temp / directory).glob(f"job_*/task_{task_id}/task_{task_id}.json"))
              assert len(candidates) == 1, (label, candidates)
              result_path = candidates[0]
              result_bytes = result_path.read_bytes()
              result = json.loads(result_bytes)
              grading = result.get("grading", {})
              assert result.get("task_id") == task_id, (label, result.get("task_id"))
              assert grading.get("score") == 1.0 and grading.get("max_score") == 1.0, (label, grading)
              assert grading.get("breakdown", {}).get("desktop_baseline_valid") == 1.0, (label, grading)

              workspace = checked_workspace(result.get("workspace"), label)
              assert workspace.is_dir(), (label, workspace)
              state_path = workspace / "desktop_baseline_state.json"
              assert state_path.is_file() and not state_path.is_symlink(), (label, state_path)
              state_bytes = state_path.read_bytes()
              state = json.loads(state_bytes)
              assert state == {"current_text": target, "saved": True, "text": target}, (label, state)
              expected_state_paths.add(state_path)
              validated_states.append((label, result_path, result_bytes, state_path, state_bytes))

          actual_state_paths = set(workspace_root.glob("*/agent_workspace/desktop_baseline_state.json"))
          assert actual_state_paths == expected_state_paths, {
              "expected": sorted(map(str, expected_state_paths)),
              "actual": sorted(map(str, actual_state_paths)),
          }

          negative_candidates = list(
              (runner_temp / "desktop-no-copyback-results").glob(
                  f"job_*/task_{task_id}/task_{task_id}.json"
              )
          )
          assert len(negative_candidates) == 1, negative_candidates
          negative_path = negative_candidates[0]
          negative_bytes = negative_path.read_bytes()
          negative = json.loads(negative_bytes)
          negative_grade = negative.get("grading", {})
          assert negative.get("task_id") == task_id, negative.get("task_id")
          assert negative_grade.get("score") == 0.0 and negative_grade.get("max_score") == 1.0, negative_grade
          assert negative_grade.get("breakdown", {}).get("desktop_baseline_valid") == 0.0, negative_grade
          negative_workspace = checked_workspace(negative.get("workspace"), "negative-control")
          negative_state = negative_workspace / "desktop_baseline_state.json"
          assert not negative_state.exists() and not negative_state.is_symlink(), (
              "negative control unexpectedly copied grader state to host",
              negative_state,
          )

          evidence_dir.mkdir(parents=True)
          for label, result_path, result_bytes, state_path, state_bytes in validated_states:
              state_name = f"{label}.json"
              (evidence_dir / state_name).write_bytes(state_bytes)
              manifest["positive_runs"].append({
                  "label": label,
                  "result_path": str(result_path.relative_to(runner_temp)),
                  "result_sha256": hashlib.sha256(result_bytes).hexdigest(),
                  "state_file": state_name,
                  "state_sha256": hashlib.sha256(state_bytes).hexdigest(),
              })

          manifest["negative_control"] = {
              "result_path": str(negative_path.relative_to(runner_temp)),
              "result_sha256": hashlib.sha256(negative_bytes).hexdigest(),
              "score": 0.0,
              "state_file_copied_to_host": False,
          }
          (evidence_dir / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("preserved four grader-only desktop state files and hashes; negative-control state remains absent from host workspace")
          PY

      - name: Upload deterministic desktop lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-reference-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/desktop-reference-results/job_*/task_task_9000_desktop_notes_gui/task_task_9000_desktop_notes_gui.json
            ${{ runner.temp }}/desktop-reference-results-repeat/job_*/task_task_9000_desktop_notes_gui/task_task_9000_desktop_notes_gui.json
            ${{ runner.temp }}/desktop-openclaw-stub-first/job_*/task_task_9000_desktop_notes_gui/task_task_9000_desktop_notes_gui.json
            ${{ runner.temp }}/desktop-openclaw-stub-repeat/job_*/task_task_9000_desktop_notes_gui/task_task_9000_desktop_notes_gui.json
            ${{ runner.temp }}/desktop-no-copyback-results/job_*/task_task_9000_desktop_notes_gui/task_task_9000_desktop_notes_gui.json
            ${{ runner.temp }}/desktop-state-evidence/**
          if-no-files-found: warn
          retention-days: 7
